name: Publish development image

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check the published image without rebuilding or publishing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Reserve disk space for nested container images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install container tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman catatonit
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build Kalibr and development image
        if: github.event.inputs.verify_only != 'true'
        env:
          TIDESENSE_DEV_IMAGE: ghcr.io/humpbacklab/tidesense-dev:ubuntu24.04
        run: ./scripts/dev-container.sh build
      - name: Check configurator, ROS and both Kalibr solvers offline
        run: ./scripts/dev-image/check.sh ghcr.io/humpbacklab/tidesense-dev:ubuntu24.04
      - name: Push image
        if: github.event.inputs.verify_only != 'true'
        run: podman push ghcr.io/humpbacklab/tidesense-dev:ubuntu24.04
